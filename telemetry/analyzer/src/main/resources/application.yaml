spring:
  application:
    name: analyzer
  datasource:
    url: ${ANALYZER_DB_URL:jdbc:postgresql://localhost:5432/telemetry_analyzer}
    username: ${ANALYZER_DB_USER:dbuser}
    password: ${ANALYZER_DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

analyzer:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    hubs-group-id: ${ANALYZER_HUBS_GROUP_ID:analyzer-hubs}
    snapshots-group-id: ${ANALYZER_SNAPSHOTS_GROUP_ID:analyzer-snapshots}
    topics:
      hubs: ${HUBS_TOPIC:telemetry.hubs.v1}
      snapshots: ${SNAPSHOTS_TOPIC:telemetry.snapshots.v1}

grpc:
  client:
    hub-router:
      address: ${HUB_ROUTER_ADDRESS:static://localhost:59090}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
